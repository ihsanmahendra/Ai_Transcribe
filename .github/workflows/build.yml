name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Versi toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache dependensi Swift
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build app + DMG (Apple Silicon & Intel)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "::notice::$(xcodebuild -version | tr '\n' ' ') · SDK $(xcrun --sdk macosx --show-sdk-version)"
          set -o pipefail
          if ! ./build-app.sh --universal --dmg 2>&1 | tee build.log; then
            # Ubah error compiler menjadi anotasi agar terlihat di ringkasan run.
            set +e +o pipefail
            grep -E ': (error|fatal error):' build.log | sort -u | head -40 | while IFS= read -r line; do
              file=$(echo "$line" | cut -d: -f1); ln=$(echo "$line" | cut -d: -f2)
              msg=$(echo "$line" | cut -d: -f4- | sed 's/^ *//')
              echo "::error file=${file#$GITHUB_WORKSPACE/},line=${ln}::${msg}"
            done
            grep -E '✗|^error:|error: ' build.log | grep -vE ':[0-9]+:[0-9]+: ' | sort -u | head -15 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            grep -vE '^\[[0-9]+/[0-9]+\] (Compiling|Emitting|Write|Planning)' build.log | tail -40 | while IFS= read -r line; do echo "::warning::${line}"; done
            exit 1
          fi

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: AI-Transcriber
          path: build/*.dmg
          if-no-files-found: error

      - name: Rilis GitHub (saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.dmg
          generate_release_notes: true
